services:
  postgres:
    image: postgres:16
    platform: linux/amd64  # Windows本地启动偶发exec format error，固定架构避免拉取镜像不匹配
    container_name: madf-postgres
    environment:
      POSTGRES_USER: madf
      POSTGRES_PASSWORD: madf
      POSTGRES_DB: madf
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U madf"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    platform: linux/amd64 # fix: exec format error on Windows
    container_name: madf-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pg_data:
